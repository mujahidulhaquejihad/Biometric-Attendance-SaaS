services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendance}
      POSTGRES_DB: attendance
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [db]
    env_file: ./web/.env
    environment:
      DATABASE_URL: postgresql://attendance:${POSTGRES_PASSWORD:-attendance}@db:5432/attendance
      BETTER_AUTH_URL: https://${DOMAIN:-localhost}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
